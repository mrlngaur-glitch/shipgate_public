# Hash-pinned 2026-08-17, expanded 2026-08-18 (Refinement 1: hash-coverage and
# tested-platform are two different claims, kept in two different sentences).
#
# HASH-COVERED (every package installable with `--require-hashes` here): Windows amd64,
# manylinux x86_64, manylinux aarch64, macOS arm64, macOS x86_64, and the sdist as a
# universal fallback. 20 of the 25 packages here are pure Python (one py3-none-any wheel,
# already identical bytes on every platform, one hash each). The other 5 ship compiled
# extensions and needed one hash per platform: coverage, grimp, PyYAML, rpds-py, ruff.
# Every wheel/sdist hash below was fetched directly from PyPI, never a mirror:
#   pip download --no-deps --only-binary=:all: --python-version 312 --implementation cp
#     --abi cp312 --platform <win_amd64|manylinux2014_x86_64|manylinux2014_aarch64|
#     macosx_11_0_arm64|macosx_10_13_x86_64> -d <dir> <pkg>==<version>
# for the wheels, and PyPI's own JSON API (`https://pypi.org/pypi/<pkg>/<version>/json`)
# for each sdist, downloaded and independently re-hashed with hashlib.sha256, confirmed to
# match PyPI's own recorded digest before being trusted.
#
# A hash entry is NOT a support claim. `--require-hashes` only PERMITS an artifact whose
# fingerprint is listed here — adding more hashes can only remove a barrier, never weaken
# the check. Whether a platform actually WORKS is a separate, narrower claim:
#
# TESTED (this project has actually run the full suite here): Windows amd64, in this
# project's own dev venv. manylinux x86_64 will be tested the first time CI actually runs.
# macOS (both architectures), manylinux aarch64, and installs
# built from the sdist fallback are hash-covered and installable, but this project has
# never run on any of them — say so if one breaks, don't assume it works because it
# installs.
#
# `pip install --require-hashes -r requirements.lock` is how CI and the documented dev
# setup install this file.

